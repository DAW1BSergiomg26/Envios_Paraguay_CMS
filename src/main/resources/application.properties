server.port=${PORT:8080}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# =========================
# ASSETS / CACHE-BUSTING
# =========================
# Versión de los assets estáticos. Subir el valor (o APP_CSS_VERSION) al
# desplegar cambios de CSS para invalidar la caché del navegador/nginx.
app.web.css-version=${APP_CSS_VERSION:1}

# =========================
# BASE DE DATOS MYSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/envios_paraguay_cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&autoReconnect=true&retryWrites=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# =========================
# HikariCP Pool
# =========================

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EnviosHikariPool
spring.datasource.hikari.leak-detection-threshold=60000

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================
# SQL
# =========================

spring.sql.init.mode=never

# =========================
# SUBIDA DE ARCHIVOS
# =========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de subida de imágenes (relativo o absoluto, configurable vía env var)
app.upload.dir=${UPLOAD_DIR:./uploads}

# =========================
# ACTUATOR / HEALTH
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true
management.info.env.enabled=true

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# =========================
# ADMIN CREDENTIALS (dev defaults — sobreescribir en producción)
# =========================

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# =========================
# SMTP (Mailpit/dev)
# =========================
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================
# NOTIFICACIONES AUTOMÁTICAS
# =========================
# app.notification.mail.enabled=false apaga el envío al cliente sin redeploy
app.notification.mail.from=${APP_NOTIFICATION_MAIL_FROM:no-reply@enviosparaguay.com.py}
app.notification.mail.enabled=${APP_NOTIFICATION_MAIL_ENABLED:true}
app.notification.tracking.base-url=${APP_TRACKING_BASE_URL:http://localhost:8080/tracking}

# =========================
# WEBHOOKS OUTBOUND
# =========================
# app.webhook.enabled=false apaga el despacho de webhooks sin redeploy
app.webhook.enabled=${APP_WEBHOOK_ENABLED:true}
# Timeouts del RestClient en milisegundos (evitan hilos @Async colgados)
app.webhook.connect-timeout=${APP_WEBHOOK_CONNECT_TIMEOUT:2000}
app.webhook.read-timeout=${APP_WEBHOOK_READ_TIMEOUT:5000}
app.webhook.tracking.base-url=${APP_TRACKING_BASE_URL:http://localhost:8080/tracking}
# Executor dedicado (aisla el despacho HTTP del pool de notificaciones)
app.webhook.executor.core-size=${APP_WEBHOOK_EXECUTOR_CORE:4}
app.webhook.executor.max-size=${APP_WEBHOOK_EXECUTOR_MAX:8}
app.webhook.executor.queue-capacity=${APP_WEBHOOK_EXECUTOR_QUEUE:100}

# =========================
# CARGA MASIVA POR CSV (BATCH IMPORTS)
# =========================
# app.batch.enabled=false apaga la ingesta por lotes sin redeploy
app.batch.enabled=${APP_BATCH_ENABLED:true}
app.batch.chunk-size=${APP_BATCH_CHUNK_SIZE:100}
app.batch.tmp-dir=${APP_BATCH_TMP_DIR:./uploads/batch-imports}
app.batch.max-file-size=${APP_BATCH_MAX_FILE_SIZE:5MB}
app.batch.max-line-length=${APP_BATCH_MAX_LINE_LENGTH:10000}
app.batch.max-rows=${APP_BATCH_MAX_ROWS:200000}
# Executor dedicado (aisla la ingesta del pool de notificaciones/webhooks)
app.batch.executor.core-size=${APP_BATCH_EXECUTOR_CORE:2}
app.batch.executor.max-size=${APP_BATCH_EXECUTOR_MAX:4}
app.batch.executor.queue-capacity=${APP_BATCH_EXECUTOR_QUEUE:500}

# =========================
# OPENAPI / SWAGGER
# =========================

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.show-actuator=false

# =========================
# REDIS / SESSION
# =========================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# Pool de conexiones Lettuce (requiere commons-pool2 en el classpath)
spring.data.redis.lettuce.pool.max-active=30
spring.data.redis.lettuce.pool.max-idle=15
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Save/Flush explícitos (defaults de Spring Session; documentan intención anti-race-condition)
spring.session.redis.save-mode=on-set-attribute
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=monteastur:session
server.servlet.session.timeout=30m

# =========================
# PDF / ETIQUETAS / BARCODES
# =========================
app.pdf.enabled=${APP_PDF_ENABLED:true}
app.pdf.max-pages=${APP_PDF_MAX_PAGES:5000}
app.pdf.tracking.base-url=${APP_TRACKING_BASE_URL:http://localhost:8080/tracking}
app.pdf.qr.size=${APP_PDF_QR_SIZE:200}
app.pdf.barcode.width=${APP_PDF_BARCODE_WIDTH:500}
app.pdf.barcode.height=${APP_PDF_BARCODE_HEIGHT:120}

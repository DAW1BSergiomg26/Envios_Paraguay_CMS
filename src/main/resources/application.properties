server.port=${PORT:8080}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# =========================
# BASE DE DATOS MYSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/envios_paraguay_cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&autoReconnect=true&retryWrites=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =========================
# HikariCP Pool
# =========================

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EnviosHikariPool
spring.datasource.hikari.leak-detection-threshold=60000

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================
# SQL
# =========================

spring.sql.init.mode=never

# =========================
# SUBIDA DE ARCHIVOS
# =========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de subida de imágenes (relativo o absoluto, configurable vía env var)
app.upload.dir=${UPLOAD_DIR:./uploads}

# =========================
# ACTUATOR / HEALTH
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true
management.info.env.enabled=true

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# =========================
# ADMIN CREDENTIALS (dev defaults — sobreescribir en producción)
# =========================

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# =========================
# EMAIL (SMTP)
# =========================
# Descomenta y configura para activar notificaciones por email
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tuemail@gmail.com
# spring.mail.password=tu-contrasena-de-aplicacion
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.from=tuemail@gmail.com
# spring.mail.to=admin@casarrural.com

# =========================
# OPENAPI / SWAGGER
# =========================

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.show-actuator=false
server.port=${PORT:8081}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# =========================
# BASE DE DATOS MYSQL
# =========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/casarural?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# SQL
# =========================

spring.sql.init.mode=never

# =========================
# SUBIDA DE ARCHIVOS
# =========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de subida de imágenes (relativo o absoluto, configurable vía env var)
app.upload.dir=${UPLOAD_DIR:./uploads}

# =========================
# ACTUATOR / HEALTH
# =========================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# =========================
# ADMIN CREDENTIALS (dev defaults — sobreescribir en producción)
# =========================

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}


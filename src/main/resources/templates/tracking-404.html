<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Envío no encontrado')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="public-container tracking-404-page">
    <div class="glass-card tracking-404-card">
        <div class="tracking-404-icon">
            <i data-lucide="package-search" class="luxury-icon"></i>
        </div>
        <p class="tracking-404-code">404</p>
        <h1 class="tracking-404-title">Envío no encontrado</h1>
        <p class="tracking-404-text">
            No encontramos ningún envío con el código
            <span class="font-bold" th:text="${codigo}">MT-...</span>. Verifícalo e inténtalo de nuevo.
        </p>
        <form method="post" th:action="@{/tracking}" class="tracking-search-form">
            <input type="text" name="codigo" th:value="${codigo}" required
                   placeholder="Introduce tu código MONTEASTUR" class="form-control">
            <button type="submit" class="btn-luxury">
                <i data-lucide="rotate-ccw" class="luxury-icon luxury-icon-sm"></i> Reintentar
            </button>
        </form>
        <a href="/tracking" class="tracking-404-link">
            <i data-lucide="qrcode" class="luxury-icon luxury-icon-sm"></i> Escanear otro QR
        </a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Env&iacute;os | MONTEASTUR ENVIOS</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="/js/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/admin-sidebar :: admin-sidebar(seccionActiva='reservas')}"></div>

<div class="main-content">
    <div class="card">
        <h1 style="color: #d4762a;">Listado de Env&iacute;os</h1>
        <p th:if="${#lists.size(reservas) == 0}" class="vacio" style="color: #3f6338; font-weight: 600;">No hay env&iacute;os registrados.</p>
        <div class="table-wrap" th:if="${#lists.size(reservas) > 0}">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Bultos</th>
                        <th>Estado</th>
                        <th>Comentarios</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reservas}">
                        <td th:text="${r.nombreCliente}">Juan Pérez</td>
                        <td th:text="${r.email}">correo@ejemplo.com</td>
                        <td th:text="${r.telefono} ?: '—'">123456789</td>
                        <td th:text="${#temporals.format(r.fechaEntrada, 'dd/MM/yyyy')}">12/06/2026</td>
                        <td th:text="${#temporals.format(r.fechaSalida, 'dd/MM/yyyy')}">15/06/2026</td>
                        <td th:text="${r.numeroHuespedes}">3</td>
                        <td>
                            <span th:if="${r.estado == 'pendiente'}" class="estado-pendiente">Pendiente</span>
                            <span th:if="${r.estado == 'aprobada' or r.estado == 'confirmada'}" class="estado-aprobada">Aprobada</span>
                            <span th:if="${r.estado == 'cancelada'}" class="estado-cancelada">Cancelada</span>
                        </td>
                        <td th:text="${r.comentarios} ?: '—'" style="max-width: 200px; white-space: normal;">comentario</td>
                        <td class="acciones">
                            <form th:if="${r.estado == 'pendiente'}" th:action="@{/admin/reservas/aprobar/{id}(id=${r.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn-aprobar" title="Aprobar">✓</button>
                            </form>
                            <form th:if="${r.estado == 'pendiente' or r.estado == 'aprobada' or r.estado == 'confirmada'}" th:action="@{/admin/reservas/cancelar/{id}(id=${r.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn-cancelar" title="Cancelar" onclick="return confirm('¿Cancelar este env&iacute;o?')">✕</button>
                            </form>
                            <form th:action="@{/admin/reservas/eliminar/{id}(id=${r.id})}" method="post" style="display:inline">
                                <button type="submit" class="btn-eliminar" title="Eliminar" onclick="return confirm('¿Eliminar este env&iacute;o definitivamente?')">🗑</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Textos Legales | MONTEASTUR ENVIOS</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="/js/app.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/admin-sidebar :: admin-sidebar(seccionActiva='textos')}"></div>

<div class="main-content">
    <div class="card glass-card">
        <h1 class="luxury-heading-lg" style="color: #d4762a;">Gesti&oacute;n de Textos Legales</h1>
        <p style="color: #3f6338; font-weight: 600;">Edita los textos que aparecen en las p&aacute;ginas de Aviso Legal y Pol&iacute;tica de Cookies.</p>

        <div th:if="${param.guardado}" class="toast toast-success">
            <span class="toast-icon"><i data-lucide="check" class="luxury-icon"></i></span>
            Texto guardado correctamente.
        </div>

        <div class="legal-editor">
            <form th:if="${avisoLegal != null}" th:action="@{/admin/textos}" method="post">
                <input type="hidden" name="slug" value="aviso-legal">
                <label th:text="${avisoLegal.titulo}"><i data-lucide="file-text" class="luxury-icon luxury-icon-sm"></i> Aviso Legal</label>
                <input type="text" name="titulo" th:value="${avisoLegal.titulo}"
                       style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box;" class="focus-glow">
                <textarea name="contenido" rows="12" th:text="${avisoLegal.contenido}" class="focus-glow"></textarea>
                <button type="submit" class="btn-luxury"><i data-lucide="save" class="luxury-icon luxury-icon-sm"></i> Guardar Cambios</button>
            </form>

            <hr style="margin:30px 0;border:none;border-top:1px solid #eee;">

            <form th:if="${politicaCookies != null}" th:action="@{/admin/textos}" method="post">
                <input type="hidden" name="slug" value="politica-cookies">
                <label th:text="${politicaCookies.titulo}"><i data-lucide="file-text" class="luxury-icon luxury-icon-sm"></i> Pol&iacute;tica de Cookies</label>
                <input type="text" name="titulo" th:value="${politicaCookies.titulo}"
                       style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box;" class="focus-glow">
                <textarea name="contenido" rows="12" th:text="${politicaCookies.contenido}" class="focus-glow"></textarea>
                <button type="submit" class="btn-luxury"><i data-lucide="save" class="luxury-icon luxury-icon-sm"></i> Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${envio.id != null}">CMS - Editar Env&iacute;o | MONTEASTUR ENVIOS</title>
    <title th:unless="${envio.id != null}">CMS - Nuevo Env&iacute;o | MONTEASTUR ENVIOS</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/theme-ui.css}">
    <script src="/js/app.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
</head>
<body>

<div th:replace="~{fragments/admin-sidebar :: admin-sidebar(seccionActiva='tracking')}"></div>
</div>

<div class="main-content">

    <div class="dashboard-header">
        <div class="dashboard-header-content">
            <h1 th:if="${envio.id != null}">Editar Env&iacute;o</h1>
            <h1 th:unless="${envio.id != null}">Nuevo Env&iacute;o</h1>
            <p>Completa los datos del env&iacute;o.</p>
        </div>
    </div>

    <div class="card glass-card">
        <form th:action="@{/admin/tracking/guardar}" method="post">
            <input type="hidden" name="id" th:value="${envio.id}">

            <div class="legal-editor">
                <label>C&oacute;digo &uacute;nico</label>
                <input type="text" name="codigoUnico" th:value="${envio.codigoUnico != null ? envio.codigoUnico : codigoSugerido}" required class="tracking-admin-input focus-glow">

                <label>Destinatario</label>
                <input type="text" name="destinatario" th:value="${envio.destinatario}" required class="tracking-admin-input focus-glow">

                <label>Estado</label>
                <select name="estado" required class="tracking-admin-select focus-glow">
                    <option value="RECIBIDO" th:selected="${envio.estado == 'RECIBIDO'}"><i data-lucide="package" class="luxury-icon luxury-icon-sm"></i> Recibido en origen</option>
                    <option value="EN_ADUANA_ORIGEN" th:selected="${envio.estado == 'EN_ADUANA_ORIGEN'}"><i data-lucide="shield" class="luxury-icon luxury-icon-sm"></i> Aduana de origen</option>
                    <option value="EN_TRANSITO" th:selected="${envio.estado == 'EN_TRANSITO'}"><i data-lucide="truck" class="luxury-icon luxury-icon-sm"></i> Tr&aacute;nsito atl&aacute;ntico</option>
                    <option value="EN_ADUANA_DESTINO" th:selected="${envio.estado == 'EN_ADUANA_DESTINO'}"><i data-lucide="shield" class="luxury-icon luxury-icon-sm"></i> Aduana de destino</option>
                    <option value="EN_REPARTO" th:selected="${envio.estado == 'EN_REPARTO'}"><i data-lucide="map-pin" class="luxury-icon luxury-icon-sm"></i> Reparto local</option>
                    <option value="ENTREGADO" th:selected="${envio.estado == 'ENTREGADO'}"><i data-lucide="check-circle" class="luxury-icon luxury-icon-sm"></i> Entregado</option>
                </select>

                <label>Origen</label>
                <input type="text" name="origen" th:value="${envio.origen}" class="tracking-admin-input focus-glow">

                <label>Destino</label>
                <input type="text" name="destino" th:value="${envio.destino}" class="tracking-admin-input focus-glow">

                <label>Peso</label>
                <input type="text" name="peso" th:value="${envio.peso}" placeholder="Ej: 120 kg" class="tracking-admin-input focus-glow">

                <label>Contenido</label>
                <input type="text" name="contenido" th:value="${envio.contenido}" placeholder="Ej: Maquinaria industrial" class="tracking-admin-input focus-glow">

                <label>Cliente asociado</label>
                <select name="clienteId" class="tracking-admin-select focus-glow">
                    <option value="">— Sin cliente —</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:selected="${envio.cliente != null and envio.cliente.id == c.id}" th:text="${c.nombre + ' (' + c.email + ')'}">Cliente</option>
                </select>

                <label>Observaciones</label>
                <textarea name="observaciones" th:text="${envio.observaciones}" class="tracking-admin-textarea focus-glow" placeholder="Notas internas o novedades del env&iacute;o..."></textarea>

                <div class="tracking-form-actions">
                    <button type="submit" class="btn-luxury"><i data-lucide="save" class="luxury-icon luxury-icon-sm"></i> Guardar env&iacute;o</button>
                    <a href="/admin/tracking" class="btn-luxury-ghost">Cancelar</a>
                </div>
            </div>
        </form>
    </div>

    <div th:if="${envio.id != null and eventos != null and !#lists.isEmpty(eventos)}" class="card glass-card evento-section">
        <h3 class="luxury-heading">Historial del env&iacute;o</h3>
        <div class="evento-timeline">
            <div th:each="ev : ${eventos}" class="evento-item">
                <div class="evento-dot" th:style="'background:' + ${ev.color}"></div>
                <div class="evento-line"></div>
                <div class="evento-card">
                    <div class="evento-card-head">
                        <span class="evento-icon"><i data-lucide="package" class="luxury-icon"></i></span>
                        <strong class="evento-titulo" th:text="${ev.titulo}">Título</strong>
                        <span class="evento-badge" th:style="'background:' + ${ev.color}" th:text="${ev.estado}">Estado</span>
                    </div>
                    <div class="evento-card-meta">
                        <span class="evento-fecha" th:text="${#temporals.format(ev.fechaEvento, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                        <span th:if="${ev.ubicacion != null}" class="evento-ubicacion" th:text="${ev.ubicacion}">Ubicación</span>
                    </div>
                    <p th:if="${ev.descripcion != null and !ev.descripcion.isEmpty()}" class="evento-desc" th:text="${ev.descripcion}">Descripción</p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${envio.id != null}" class="card glass-card evidencia-section">
        <h3 class="luxury-heading"><i data-lucide="camera" class="luxury-icon luxury-icon-sm"></i> Evidencias del env&iacute;o</h3>

        <div th:if="${exito}" class="toast toast-success" th:text="${exito}"></div>
        <div th:if="${error}" class="toast toast-error" th:text="${error}"></div>

        <form th:action="@{/admin/tracking/evidencia/{id}(id=${envio.id})}" method="post" enctype="multipart/form-data" class="evidencia-form">
            <div class="evidencia-form-row">
                <input type="text" name="titulo" placeholder="T&iacute;tulo" required class="evidencia-input focus-glow">
                <input type="text" name="descripcion" placeholder="Descripci&oacute;n (opcional)" class="evidencia-input focus-glow">
                <select name="tipo" class="evidencia-select focus-glow">
                    <option value="FOTO"><i data-lucide="camera" class="luxury-icon luxury-icon-sm"></i> Foto</option>
                    <option value="DOCUMENTO"><i data-lucide="file-text" class="luxury-icon luxury-icon-sm"></i> Documento</option>
                </select>
                <input type="file" name="archivo" required class="evidencia-file">
                <button type="submit" class="btn-luxury-outline"><i data-lucide="upload" class="luxury-icon luxury-icon-sm"></i> Subir</button>
            </div>
        </form>

        <div th:if="${evidencias != null and !evidencias.isEmpty()}" class="evidencia-gallery">
            <div th:each="ev : ${evidencias}" class="evidencia-card">
                <div class="evidencia-preview" th:if="${ev.tipo == 'FOTO'}">
                    <img th:src="${ev.urlArchivo}" th:alt="${ev.titulo}" class="evidencia-thumb">
                </div>
                <div class="evidencia-preview evidencia-doc" th:if="${ev.tipo == 'DOCUMENTO'}">
                    <span class="evidencia-doc-icon"><i data-lucide="file-text" class="luxury-icon"></i></span>
                </div>
                <div class="evidencia-info">
                    <strong th:text="${ev.titulo}">T&iacute;tulo</strong>
                    <div class="evidencia-status">
                        <span th:if="${ev.visibleCliente}" class="badge-visible">Visible cliente</span>
                        <span th:unless="${ev.visibleCliente}" class="badge-oculta">Oculta cliente</span>
                    </div>
                    <span th:if="${ev.descripcion != null and !ev.descripcion.isEmpty()}" th:text="${ev.descripcion}" class="evidencia-desc"></span>
                    <span class="evidencia-date" th:text="${#temporals.format(ev.fechaSubida, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                    <a th:href="${ev.urlArchivo}" target="_blank" class="evidencia-link">
                        <span th:text="${ev.tipo == 'FOTO'} ? 'Ver foto' : 'Ver documento'">Ver</span>
                    </a>
                </div>
                <div class="evidencia-controls">
                    <form th:action="@{/admin/tracking/evidencia/toggle/{evId}(evId=${ev.id})}" method="post" style="display: inline;">
                        <input type="hidden" name="envioId" th:value="${envio.id}">
                        <button type="submit" class="btn-toggle-evidencia" th:text="${ev.visibleCliente} ? 'Ocultar' : 'Mostrar'">Toggle</button>
                    </form>
                    <form th:action="@{/admin/tracking/evidencia/eliminar/{evId}(evId=${ev.id})}" method="post" class="evidencia-delete-form" onsubmit="return confirm('Eliminar esta evidencia?')">
                        <input type="hidden" name="envioId" th:value="${envio.id}">
                        <button type="submit" class="btn-evidencia-delete" title="Eliminar"><i data-lucide="trash-2" class="luxury-icon"></i></button>
                    </form>
                </div>
            </div>
        </div>
        <p th:if="${evidencias == null or evidencias.isEmpty()}" class="evidencia-empty">A&uacute;n no hay evidencias subidas para este env&iacute;o.</p>
    </div>

</div>

</body>
</html>

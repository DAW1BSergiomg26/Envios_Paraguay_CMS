<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS - Consultas | MONTEASTUR ENVIOS</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" th:href="@{/css/theme-ui.css}" />
    <script src="/js/app.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
  </head>
  <body>
    <div
      th:replace="~{fragments/admin-sidebar :: admin-sidebar(seccionActiva='mensajes')}"
    ></div>

    <div class="main-content">
      <div class="card glass-card">
        <h1 class="luxury-heading-lg">Mensajes Recibidos</h1>
        <p>Mensajes enviados desde el formulario de contacto de la web.</p>

        <p th:if="${#lists.size(mensajes) == 0}" class="vacio">
          No hay mensajes recibidos.
        </p>
        <div class="table-wrap" th:if="${#lists.size(mensajes) > 0}">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Mensaje</th>
                <th>Estado</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${mensajes}">
                <td th:text="${m.nombre}">Juan</td>
                <td th:text="${m.email}">correo@ejemplo.com</td>
                <td th:text="${m.telefono} ?: '—'">123456789</td>
                <td
                  th:text="${m.mensaje}"
                  style="max-width: 300px; white-space: normal"
                >
                  Mensaje de ejemplo
                </td>
                <td>
                  <span
                    th:if="${m.leido != null and m.leido}"
                    class="status-dot status-LEIDO"
                  ></span>
                  <span
                    th:if="${m.leido == null or !m.leido}"
                    class="status-dot status-NO_LEIDO"
                  ></span>
                  <span
                    th:text="${m.leido != null and m.leido} ? 'Leído' : 'No leído'"
                  ></span>
                </td>
                <td
                  th:text="${#temporals.format(m.fechaEnvio, 'dd/MM/yyyy HH:mm')}"
                >
                  15/05/2026 12:00
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>

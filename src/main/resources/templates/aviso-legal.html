<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Aviso Legal')}"></head>

<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main>
        <section class="pagina-titulo">
            <h2 th:text="${texto?.titulo} ?: 'Aviso Legal'">Aviso Legal</h2>
        </section>

        <section class="contenido-legal" th:utext="${texto?.contenido} ?: 'Contenido no disponible.'">
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MONTEASTUR ENVIOS</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="/js/app.js" defer></script>
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="logo">📦</div>
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">Panel de gesti&oacute;n MONTEASTUR ENVIOS</p>

        <div th:if="${param.error}" class="error-msg">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="logout-msg">
            Sesión cerrada correctamente.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <a href="/" class="back-link">Volver a la web pública</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" th:lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Acceso CMS')}"></head>
<body class="login-body">

<button type="button" class="btn-theme-toggle btn-theme-toggle--floating" aria-label="Activar modo claro" title="Activar modo claro">
    <i data-lucide="sun" class="luxury-icon luxury-icon-sm"></i>
</button>

<div class="login-wrapper glass-card">
    <a th:href="@{/}" class="brand-logo">
        <span class="brand-monteastur">MONTEASTUR</span>
        <span class="logo-tricolor"><span class="tri-rojo">EN</span><span class="tri-blanco">VI</span><span class="tri-azul">OS</span></span>
    </a>
    <div class="login-header">
        <i data-lucide="shield-check" class="luxury-icon luxury-icon-lg"></i>
        <h1 class="luxury-heading-lg">Centro de Operaciones</h1>
        <p>MONTEASTUR ENVIOS</p>
    </div>

    <form action="#" th:action="@{/login}" method="post">
        <div class="login-field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" required autofocus />
        </div>
        <div class="login-field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn-luxury">Entrar</button>
    </form>

    <div class="login-footer">
        <a th:href="@{/}"><i data-lucide="arrow-left" class="luxury-icon luxury-icon-sm"></i> Volver a la web</a>
    </div>
</div>

</body>
</html>

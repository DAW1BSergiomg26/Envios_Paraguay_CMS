<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Acceso Clientes')}"></head>
<body class="login-body">

<div class="login-wrapper glass-card">
    <a href="/" class="brand-logo">
        <span class="brand-monteastur">MONTEASTUR</span>
        <span>
            <span class="brand-envios-en">EN</span>
            <span class="brand-envios-vi">VI</span>
            <span class="brand-envios-os">OS</span>
        </span>
    </a>
    <div class="login-header">
        <i data-lucide="lock" class="luxury-icon luxury-icon-lg"></i>
        <h1 class="luxury-heading-lg">Acceso Clientes</h1>
        <p>MONTEASTUR ENVIOS</p>
    </div>

    <div th:if="${error}" class="toast toast-error" th:text="${error}">Error</div>

    <form method="post" th:action="@{/cliente/login}">
        <div class="login-field">
            <label><i data-lucide="user" class="luxury-icon luxury-icon-sm"></i> Email</label>
            <input type="email" name="email" placeholder="tu@email.com" required class="form-control">
        </div>
        <div class="login-field">
            <label>Contrase&ntilde;a</label>
            <input type="password" name="password" placeholder="••••••" required class="form-control">
        </div>
        <button type="submit" class="btn-luxury"><i data-lucide="log-in" class="luxury-icon luxury-icon-sm"></i> Ingresar al panel</button>
    </form>

    <div class="login-footer">
        <a href="/"><i data-lucide="arrow-left" class="luxury-icon luxury-icon-sm"></i> Volver a la web</a>
    </div>
</div>

<button type="button" class="btn-theme-toggle btn-theme-toggle--floating" aria-label="Activar modo claro" title="Activar modo claro">
    <i data-lucide="sun" class="luxury-icon luxury-icon-sm"></i>
</button>

</body>
</html>

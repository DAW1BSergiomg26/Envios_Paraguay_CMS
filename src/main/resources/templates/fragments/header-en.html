<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/hero-premium.css">
    <link rel="stylesheet" href="/css/operaciones-premium.css">
    <link rel="stylesheet" href="/css/tracking-premium.css">
    <link rel="stylesheet" href="/css/tracking-logistica.css">
    <link rel="stylesheet" href="/css/tracking-resultado.css">
    <link rel="stylesheet" href="/css/tracking-historial.css">
    <link rel="stylesheet" href="/css/reservas-premium.css">
    <link rel="stylesheet" href="/css/reservas-premium-v2.css">
    <link rel="stylesheet" href="/css/casa-premium.css">
    <link rel="stylesheet" href="/css/contacto-premium.css">
</head>

<th:block th:fragment="header">
    <div class="cultural-strip-paraguay"></div>
    <header>
        <div class="header-top">
            <a href="/en" class="logo">MONTEASTUR ENVIOS</a>
            <div class="header-derecha">
                <span class="telefono">+34 642 687 292</span>
                <div class="idiomas">
                    <a href="/">ES</a>
                    <a href="/en">EN</a>
                </div>
            </div>
        </div>
        <nav>
            <a href="/en">Home</a>
            <a href="/en/casa">The House</a>
            <a href="/en/tracking">Tracking</a>
            <a href="/en/reservas">Bookings</a>
            <a href="/en/contacto">Contact</a>
        </nav>
    </header>

    <div id="cookie-banner">
        <p>This website uses cookies to improve your experience.
            <a href="/en/politica-cookies">More info</a>
        </p>
        <button onclick="acceptCookies()">Accept</button>
    </div>

    <script>
        function acceptCookies() {
            localStorage.setItem('cookies_aceptadas', 'true');
            document.getElementById('cookie-banner').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('cookies_aceptadas') === 'true') {
                document.getElementById('cookie-banner').style.display = 'none';
            }
        });
    </script>
    <script src="/js/app.js" defer></script>
</th:block>

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <meta name="description" content="MONTEASTUR ENVIOS - International transport and customs clearance Spain&ndash;Paraguay. Heavy cargo, vehicles and machinery shipments with personalised tracking.">
    <meta property="og:title" th:content="${titulo} + ' - MONTEASTUR ENVIOS'">
    <meta property="og:description" content="International transport and customs clearance Spain&ndash;Paraguay. Heavy cargo, vehicles and machinery shipments.">
    <meta property="og:image" content="/img/monteastur/branding/banner-monteastur.jpg">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/jpeg" href="/img/monteastur/branding/banner-monteastur.jpg">
    <link rel="stylesheet" href="/css/style.css">
</head>

<th:block th:fragment="header">
    <header>
        <div class="header-top">
            <a href="/en" class="logo">MONTEASTUR ENVIOS</a>
            <div class="header-derecha">
                <span class="telefono">642 687 292</span>
                <div class="idiomas">
                    <a href="/">ES</a>
                    <a href="/en">EN</a>
                </div>
            </div>
        </div>
        <nav>
            <a href="/en">Home</a>
            <a href="/en/casa">Services</a>
            <a href="/en/reservas">Shipments</a>
            <a href="/en/operaciones">Operations</a>
            <a href="/en/contacto">Contact</a>
        </nav>
    </header>

    <div id="cookie-banner">
        <p>This website uses cookies to improve your experience.
            <a href="/en/politica-cookies">More info</a>
        </p>
        <button onclick="acceptCookies()">Accept</button>
    </div>

    <script>
        function acceptCookies() {
            localStorage.setItem('cookies_aceptadas', 'true');
            document.getElementById('cookie-banner').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('cookies_aceptadas') === 'true') {
                document.getElementById('cookie-banner').style.display = 'none';
            }
        });
    </script>
    <script src="/js/app.js" defer></script>
</th:block>

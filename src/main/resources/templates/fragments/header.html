<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - MONTEASTUR'">MONTEASTUR</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<th:block th:fragment="header">
    <header>
        <div class="header-top">
            <a href="/" class="logo">MONTEASTUR</a>
            <div class="header-derecha">
                <span class="telefono">642 687 292</span>
                <div class="idiomas">
                    <a href="/">ES</a>
                    <a href="/en">EN</a>
                </div>
            </div>
        </div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/casa">Servicios</a>
            <a href="/reservas">Envíos</a>
            <a href="/operaciones">Operaciones</a>
            <a href="/contacto">Contacto</a>
        </nav>
    </header>

    <div id="cookie-banner">
        <p>Este sitio web utiliza cookies para mejorar tu experiencia.
            <a href="/politica-cookies">Más información</a>
        </p>
        <button onclick="aceptarCookies()">Aceptar</button>
    </div>

    <script>
        function aceptarCookies() {
            localStorage.setItem('cookies_aceptadas', 'true');
            document.getElementById('cookie-banner').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('cookies_aceptadas') === 'true') {
                document.getElementById('cookie-banner').style.display = 'none';
            }
        });
    </script>
    <script src="/js/app.js" defer></script>
</th:block>

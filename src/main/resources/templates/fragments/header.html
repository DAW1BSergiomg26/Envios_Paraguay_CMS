<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <script src="/js/vendor/lucide.min.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
</head>

<head th:fragment="cms-head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <script src="/js/vendor/lucide.min.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
    <script src="/js/app.js" defer></script>
</head>

<th:block th:fragment="header">
    <div class="cultural-strip-paraguay"></div>
    <header>
        <div class="header-top">
            <a href="/" class="brand-logo">
                <span class="brand-monteastur">MONTEASTUR</span>
                <span class="logo-tricolor"><span class="tri-rojo">EN</span><span class="tri-blanco">VI</span><span class="tri-azul">OS</span></span>
            </a>
            <div class="header-derecha">
                <span class="telefono">+34 642 687 292</span>
                <div class="idiomas">
                    <a href="/">ES</a>
                    <a href="/en">EN</a>
                </div>
                <button type="button" class="btn-theme-toggle" aria-label="Activar modo claro" title="Activar modo claro">
                    <i data-lucide="sun" class="luxury-icon luxury-icon-sm"></i>
                </button>
                <button type="button" id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
                    <i data-lucide="menu" class="luxury-icon"></i>
                </button>
            </div>
        </div>
        <nav id="nav-principal">
            <a href="/">Inicio</a>
            <a href="/casa">La Casa</a>
            <a href="/tracking">Seguimiento</a>
            <a href="/reservas">Reservas</a>
            <a href="/contacto">Contacto</a>
        </nav>
    </header>

    <div id="cookie-banner">
        <p>Este sitio web utiliza cookies para mejorar tu experiencia.
            <a href="/politica-cookies">Más información</a>
        </p>
        <button onclick="aceptarCookies()">Aceptar</button>
    </div>

    <script>
        function aceptarCookies() {
            localStorage.setItem('cookies_aceptadas', 'true');
            document.getElementById('cookie-banner').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('cookies_aceptadas') === 'true') {
                document.getElementById('cookie-banner').style.display = 'none';
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            var burger = document.getElementById('btn-hamburguesa');
            var nav = document.getElementById('nav-principal');
            if (burger && nav) {
                burger.addEventListener('click', function() {
                    var abierto = nav.classList.toggle('abierto');
                    burger.setAttribute('aria-expanded', abierto ? 'true' : 'false');
                });
                document.addEventListener('click', function(e) {
                    if (!burger.contains(e.target) && !nav.contains(e.target)) {
                        nav.classList.remove('abierto');
                        burger.setAttribute('aria-expanded', 'false');
                    }
                });
            }
        });
    </script>
    <script src="/js/app.js" defer></script>
</th:block>

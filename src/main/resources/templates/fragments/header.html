<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/design-system.css(v=${@environment.getProperty('app.web.css-version')})}">
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <script src="/js/menu-cookie.js"></script>
    <script src="/js/vendor/lucide.min.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
</head>

<head th:fragment="cms-head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/design-system.css(v=${@environment.getProperty('app.web.css-version')})}">
    <title th:text="${titulo} + ' - MONTEASTUR ENVIOS'">MONTEASTUR ENVIOS</title>
    <script src="/js/menu-cookie.js"></script>
    <script src="/js/vendor/lucide.min.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
    <script src="/js/app.js" defer></script>
</head>

<th:block th:fragment="header">
    <div class="cultural-strip-paraguay"></div>
    <header>
        <div class="header-top">
            <a href="/" class="brand-logo">
                <span class="brand-monteastur">MONTEASTUR</span>
                <span class="logo-tricolor"><span class="tri-rojo">EN</span><span class="tri-blanco">VI</span><span class="tri-azul">OS</span></span>
            </a>
            <div class="header-derecha">
                <span class="telefono">+34 642 687 292</span>
                <div class="idiomas">
                    <a href="/">ES</a>
                    <a href="/en">EN</a>
                </div>
                <button type="button" class="btn-theme-toggle" aria-label="Activar modo claro" title="Activar modo claro">
                    <i data-lucide="sun" class="luxury-icon luxury-icon-sm"></i>
                </button>
                <button type="button" id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
                    <i data-lucide="menu" class="luxury-icon"></i>
                </button>
            </div>
        </div>
        <nav id="nav-principal">
            <a href="/">Inicio</a>
            <a href="/casa">La Casa</a>
            <a href="/tracking">Seguimiento</a>
            <a href="/reservas">Reservas</a>
            <a href="/contacto">Contacto</a>
        </nav>
    </header>

    <div class="cookie-banner">
        <p>Este sitio web utiliza cookies para mejorar tu experiencia.
            <a href="/politica-cookies">Más información</a>
        </p>
        <button type="button" class="btn-accept">Aceptar</button>
    </div>

    <script src="/js/app.js" defer></script>
</th:block>

# =============================================
# PERFIL DE PRODUCCIÓN
# Activar con: --spring.profiles.active=prod
# o env var: SPRING_PROFILES_ACTIVE=prod
# =============================================

# ---- Servidor ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Thymeleaf (caché ON en producción) ----
spring.thymeleaf.cache=true

# ---- Base de datos (forzar variables de entorno) ----
# IMPORTANTE: los defaults apuntan a TiDB Cloud como fallback seguro
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/envios_paraguay_cms?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- SQL Init (desactivado — la DB debe existir previamente en TiDB Cloud) ----
spring.sql.init.mode=never

# ---- JPA / Hibernate (seguro para producción) ----
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true

# ---- HikariCP Pool (optimizado para TiDB Cloud free tier) ----
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EnviosProdPool
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- Session Cookie (seguridad producción) ----
# secure se activa automáticamente via forward-headers-strategy cuando X-Forwarded-Proto=https
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---- Uploads ----
app.upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Actuator / Health / Metrics ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true
management.info.env.enabled=true
management.metrics.tags.application=monteastur-envios

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# ---- Demo Data (desactivado en producción) ----
app.demo-data=false

# ---- Admin Credentials (forzar variables de entorno) ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Logging ----
logging.level.com.monteastur.envios=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

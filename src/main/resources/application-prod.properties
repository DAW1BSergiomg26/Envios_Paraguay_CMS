# =============================================
# PERFIL DE PRODUCCIÓN
# Activar con: --spring.profiles.active=prod
# o env var: SPRING_PROFILES_ACTIVE=prod
# =============================================

# ---- Servidor ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Thymeleaf (caché ON en producción) ----
spring.thymeleaf.cache=true

# ---- Base de datos (obligatoria en prod; sin ella la app falla al arrancar) ----
# El EnvironmentPostProcessor añade jdbc: automáticamente si SPRING_DATASOURCE_URL
# o DATABASE_URL vienen sin prefijo (p. ej. mysql://... -> jdbc:mysql://...).
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- SQL Init (desactivado — la DB debe existir previamente en TiDB Cloud) ----
spring.sql.init.mode=never

# ---- JPA / Hibernate (seguro para producción) ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---- Flyway (migraciones) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- HikariCP Pool (optimizado para TiDB Cloud free tier) ----
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EnviosProdPool
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# ---- Session Cookie (seguridad producción) ----
# secure se activa automáticamente via forward-headers-strategy cuando X-Forwarded-Proto=https
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---- Uploads ----
app.upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Actuator / Health / Metrics ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.enable.all=true
management.info.env.enabled=false
management.metrics.tags.application=monteastur-envios

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# ---- Demo Data (desactivado en producción) ----
app.demo-data=false

# ---- Push test endpoint (deshabilitado en producción) ----
app.push.test-enabled=false

# ---- Admin Credentials (forzar variables de entorno) ----
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# ---- Logging ----
logging.level.com.monteastur.envios=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO

# ---- Redis / Session ----
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- Respuestas de error (no exponer stack traces internos) ----
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Seguridad HTTP: CSP/HSTS la emite Spring (SecurityConfig) y nginx
#      añade la misma CSP al proxy. Mantener ambas alineadas. ----

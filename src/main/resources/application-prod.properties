# =============================================
# PERFIL DE PRODUCCIÓN
# Activar con: --spring.profiles.active=prod
# o env var: SPRING_PROFILES_ACTIVE=prod
# =============================================

# ---- Servidor ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Thymeleaf (caché ON en producción) ----
spring.thymeleaf.cache=true

# ---- Base de datos (forzar variables de entorno) ----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate (seguro para producción) ----
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Session Cookie (seguridad producción) ----
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---- Uploads ----
app.upload.dir=${UPLOAD_DIR:/app/uploads}

# ---- Actuator / Health ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=Monteastur Envios
info.app.version=3.2
info.app.description=Plataforma log\u00EDstica premium Espa\u00F1a Paraguay

# ---- Demo Data (desactivado en producción) ----
app.demo-data=false

# ---- Admin Credentials (forzar variables de entorno) ----
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# ---- Logging ----
logging.level.com.grupb2.casarural=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# PERFIL DE PRODUCCIÓN
# Activar con: --spring.profiles.active=prod
# o env var: SPRING_PROFILES_ACTIVE=prod
# =============================================

# ---- Servidor ----
server.port=${PORT:8080}

# ---- Thymeleaf (caché ON en producción) ----
spring.thymeleaf.cache=true

# ---- Base de datos (forzar variables de entorno) ----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate (seguro para producción) ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Uploads ----
app.upload.dir=${UPLOAD_DIR:/app/uploads}

# ---- Logging ----
logging.level.com.grupb2.casarural=INFO
logging.level.org.springframework=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

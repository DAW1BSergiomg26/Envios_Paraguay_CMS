apiVersion: 1

# ============================================
# CONTACT POINTS — Monteastur Envios
# ============================================
# Para producción:
#   1. Configurar SMTP en docker-compose.yml (Grafana env vars):
#      GF_SMTP_ENABLED: "true"
#      GF_SMTP_HOST: smtp.monaster.com:587
#      GF_SMTP_USER: ...
#      GF_SMTP_PASSWORD: ...
#   2. Reemplazar addresses abajo con email real
#   3. Opcional: añadir receiver tipo slack/webhook
# ============================================

contactPoints:
  - name: default-email-placeholder
    receivers:
      - uid: default-email
        type: email
        settings:
          addresses: "admin@monteastur.com"

# Notification policy por defecto (usa el contact point de arriba)
policies:
  - receiver: default-email-placeholder
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

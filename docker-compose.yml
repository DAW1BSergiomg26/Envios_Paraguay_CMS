# =============================================
# MONTEASTUR ENVIOS — Docker Compose (prod)
# =============================================
# Uso:
#   1. cp .env.example .env  y ajusta credenciales
#   2. docker compose up -d
#   3. http://localhost
# =============================================

services:

  db:
    image: mysql:8.0
    container_name: monteastur-mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 256m

  app:
    build: .
    container_name: monteastur-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    mem_limit: 512m

  nginx:
    image: nginx:alpine
    container_name: monteastur-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - backend
    restart: unless-stopped
    mem_limit: 64m

  # Certbot para SSL (ejecutar solo para obtener/renovar certificados)
  #   docker compose --profile certbot run --rm certbot certonly --webroot -w /var/www/certbot -d monteastur.com
  certbot:
    image: certbot/certbot
    container_name: monteastur-certbot
    profiles:
      - certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: monteastur-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.5.2
    container_name: monteastur-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ""
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 128m

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: monteastur-uptime-kuma
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    networks:
      - backend
    mem_limit: 256m

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  logs_data:
  certbot_www:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:

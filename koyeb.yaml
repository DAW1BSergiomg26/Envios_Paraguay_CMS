# =============================================
# MONTEASTUR ENVIOS — Koyeb Service Definition
# =============================================
# Deploy:  koyeb service create monteastur-envios --app monteastur --file koyeb.yaml
# Or use the dashboard: connect GitHub repo → auto-detects Dockerfile
#
# SECRETS REQUERIDOS (crear antes en Koyeb: Settings → Secrets):
#   tidb-username   → usuario de TiDB Serverless
#   tidb-password   → contraseña de TiDB Serverless
#   admin-password  → contraseña del administrador de la app (ADMIN_PASSWORD)
#   redis-host      → hostname del Redis externo (Koyeb Redis / Upstash)
#
# Interpolación de secrets: https://www.koyeb.com/docs/build-and-deploy/environment-variables
# =============================================

name: monteastur-envios
type: web

# Build from the multi-stage Dockerfile in repo root
git:
  repository: github.com/DAW1BSergiomg26/Envios_Paraguay_CMS
  branch: feature/seguimiento-premium

instance_types:
  - type: nano        # Free tier: 512 MB RAM, 0.1 vCPU

ports:
  - port: 8080
    protocol: http

routes:
  - path: /
    port: 8080

health_checks:
  - path: /actuator/health
    port: 8080
    protocol: http
    interval: 30
    timeout: 10

# Environment variables — set via CLI or dashboard
# koyeb service update monteastur-envios --env KEY=VALUE
env:
  - key: PORT
    value: "8080"
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: JAVA_OPTS
    value: "-Xms256m -Xmx384m -XX:+UseG1GC"

  # --- MySQL externo — TiDB Serverless ---
  - key: SPRING_DATASOURCE_URL
    value: jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/envios_paraguay_cms?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
  - key: DB_USERNAME
    secret: tidb-username
  - key: DB_PASSWORD
    secret: tidb-password

  # --- Redis externo (obligatorio: el perfil prod exige sesiones en Redis) ---
  - key: REDIS_HOST
    secret: redis-host
  - key: REDIS_PORT
    value: "6379"

  # --- App ---
  - key: ADMIN_USERNAME
    value: admin
  - key: ADMIN_PASSWORD
    secret: admin-password
  - key: APP_DEMO_DATA
    value: "false"
  - key: UPLOAD_DIR
    value: /tmp/uploads

  # --- Thymeleaf ---
  - key: THYMELEAF_CACHE
    value: "true"

  # --- Health: sin SMTP configurado, el MailHealthIndicator baja el health global a DOWN.
  #     En cloud se deshabilita este indicador salvo que se configure un SMTP real. ---
  - key: MANAGEMENT_HEALTH_MAIL_ENABLED
    value: "false"

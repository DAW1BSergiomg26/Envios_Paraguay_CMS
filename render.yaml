# =============================================
# MONTEASTUR ENVIOS — Render (Blueprint Reference)
# =============================================
# Deploy:  Dashboard → New Web Service → Connect GitHub repo
# Render detecta el Dockerfile y build automático.
# Este archivo sirve como referencia de variables de entorno.
# =============================================

services:
  - type: web
    name: monteastur-envios
    runtime: image
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx384m -XX:+UseG1GC -XX:+UseStringDeduplication"
      - key: DB_DDL_AUTO
        value: validate
      - key: ADMIN_USERNAME
        value: admin
      - key: APP_DEMO_DATA
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: THYMELEAF_CACHE
        value: "true"
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE
        value: "health,info,metrics,prometheus"
      # ---- MySQL externo (PlanetScale / TiDB / Railway) ----
      # Configurar en dashboard tras crear la database externa
      # - key: SPRING_DATASOURCE_URL
      #   value: "jdbc:mysql://<HOST>:3306/envios_paraguay_cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull"
      # - key: DB_USERNAME
      #   value: "<TU_USUARIO_DB>"
      # - key: DB_PASSWORD
      #   value: "<TU_PASSWORD_DB>"
      # - key: ADMIN_PASSWORD
      #   value: "<CAMBIAR>"

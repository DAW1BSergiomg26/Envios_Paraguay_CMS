# =============================================
# Monteastur Envios — Nginx Production Example
# =============================================
# Copiar a monteastur.conf y ajustar:
#   - server_name
#   - ssl_certificate rutas
#   - ssl_certificate_key rutas
# =============================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name monteastur.com www.monteastur.com;

    # Let's Encrypt challenge (necesario para obtener/renovar certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (producción)
server {
    listen 443 ssl http2;
    server_name monteastur.com www.monteastur.com;

    # SSL certificates (copiar desde /etc/letsencrypt/live/example.com/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # Hide backend security headers before overriding
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Request size limit
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/monteastur-ssl-access.log;
    error_log /var/log/nginx/monteastur-ssl-error.log;

    # Reverse proxy to Spring Boot
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket support (futuro: tracking en tiempo real)
    # location /ws/ {
    #     proxy_pass http://app:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 86400;
    # }
}


name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:

  pre-deploy-check:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Backend tests
        run: mvn test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm install

      - name: Frontend tests
        working-directory: frontend-react
        run: npm test -- --run

      - name: Frontend build
        working-directory: frontend-react
        run: npm run build

  deploy-production:
    name: Deploy to VPS Production
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.ref == 'refs/heads/develop'
      && github.event.inputs.confirm == 'deploy'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            echo "============================================"
            echo "  Deploy Monteastur Envios — $(date)"
            echo "============================================"
            cd /opt/monteastur
            echo "[1/5] Fetching tags..."
            git fetch --all --tags
            echo "[2/5] Checking out develop..."
            git checkout develop
            echo "[3/5] Pulling latest changes..."
            git pull origin develop
            echo "[4/5] Setting script permissions..."
            chmod +x scripts/*.sh
            echo "[5/5] Running deploy script..."
            ./scripts/deploy-prod.sh
            echo "============================================"
            echo "  Deploy complete"
            echo "============================================"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()
    steps:
      - name: Print failure info
        run: |
          echo "============================================"
          echo "  DEPLOY FAILED"
          echo "============================================"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "============================================"
          echo "To rollback:"
          echo "  1. SSH to VPS: ssh deploy@<host>"
          echo "  2. cd /opt/monteastur"
          echo "  3. ./scripts/rollback-prod.sh <previous-tag>"
          echo "============================================"

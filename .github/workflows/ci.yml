name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop

env:
  MYSQL_ROOT_PASSWORD: ci_root_pass
  MYSQL_DATABASE: casarural_ci
  MYSQL_USER: ci_user
  MYSQL_PASSWORD: ci_user_pass
  SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/casarural_ci?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  DB_DDL_AUTO: validate
  JPA_SHOW_SQL: false
  THYMELEAF_CACHE: true
  UPLOAD_DIR: /app/uploads
  SMTP_HOST: ""
  SMTP_PORT: 587
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ci@monteastur.com
  SMTP_TO: ci@monteastur.com
  ADMIN_USERNAME: ci_admin
  ADMIN_PASSWORD: ci_admin_pass

jobs:

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        working-directory: frontend-react
        run: npm install
      - name: Run unit tests (Vitest)
        working-directory: frontend-react
        run: npm run test:unit
      - name: Build frontend
        working-directory: frontend-react
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-react/dist
          if-no-files-found: error

  e2e-tests:
    name: E2E Tests (Playwright, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          echo "PORT=8080" >> .env
          echo "NGINX_PORT=80" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ env.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ env.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ env.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ env.MYSQL_PASSWORD }}" >> .env
          echo "SPRING_DATASOURCE_URL=${{ env.SPRING_DATASOURCE_URL }}" >> .env
          echo "DB_USERNAME=${{ env.MYSQL_USER }}" >> .env
          echo "DB_PASSWORD=${{ env.MYSQL_PASSWORD }}" >> .env
          echo "DB_DDL_AUTO=${{ env.DB_DDL_AUTO }}" >> .env
          echo "JPA_SHOW_SQL=${{ env.JPA_SHOW_SQL }}" >> .env
          echo "THYMELEAF_CACHE=${{ env.THYMELEAF_CACHE }}" >> .env
          echo "UPLOAD_DIR=${{ env.UPLOAD_DIR }}" >> .env
          echo "SMTP_HOST=" >> .env
          echo "SMTP_PORT=${{ env.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=" >> .env
          echo "SMTP_PASSWORD=" >> .env
          echo "SMTP_FROM=${{ env.SMTP_FROM }}" >> .env
          echo "SMTP_TO=${{ env.SMTP_TO }}" >> .env
          echo "ADMIN_USERNAME=${{ env.ADMIN_USERNAME }}" >> .env
          echo "ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }}" >> .env
          echo "APP_DEMO_DATA=false" >> .env
      - name: Start Docker Compose
        run: docker compose up -d
      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"' && break
            echo "attempt $i: not ready"
            sleep 5
          done
      - name: Wait for nginx
        run: |
          for i in $(seq 1 10); do
            curl -s -o /dev/null -w '%{http_code}' http://localhost | grep -q '200' && break
            echo "attempt $i: nginx not ready"
            sleep 3
          done
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install Playwright + Chromium
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend-react
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost
          E2E_ADMIN_USER: ci_admin
          E2E_ADMIN_PASS: ci_admin_pass
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-react/playwright-report/
          if-no-files-found: warn
      - name: Debug logs on failure
        if: failure()
        run: |
          echo "=== app logs ==="
          docker compose logs app --tail 60
          echo "=== nginx logs ==="
          docker compose logs nginx --tail 30
          echo "=== db logs ==="
          docker compose logs db --tail 10

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          echo "PORT=8080" >> .env
          echo "NGINX_PORT=80" >> .env
          echo "MYSQL_ROOT_PASSWORD=${{ env.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ env.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ env.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ env.MYSQL_PASSWORD }}" >> .env
          echo "SPRING_DATASOURCE_URL=${{ env.SPRING_DATASOURCE_URL }}" >> .env
          echo "DB_USERNAME=${{ env.MYSQL_USER }}" >> .env
          echo "DB_PASSWORD=${{ env.MYSQL_PASSWORD }}" >> .env
          echo "DB_DDL_AUTO=${{ env.DB_DDL_AUTO }}" >> .env
          echo "JPA_SHOW_SQL=${{ env.JPA_SHOW_SQL }}" >> .env
          echo "THYMELEAF_CACHE=${{ env.THYMELEAF_CACHE }}" >> .env
          echo "UPLOAD_DIR=${{ env.UPLOAD_DIR }}" >> .env
          echo "SMTP_HOST=" >> .env
          echo "SMTP_PORT=${{ env.SMTP_PORT }}" >> .env
          echo "SMTP_USERNAME=" >> .env
          echo "SMTP_PASSWORD=" >> .env
          echo "SMTP_FROM=${{ env.SMTP_FROM }}" >> .env
          echo "SMTP_TO=${{ env.SMTP_TO }}" >> .env
          echo "ADMIN_USERNAME=${{ env.ADMIN_USERNAME }}" >> .env
          echo "ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }}" >> .env
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build Docker images
        run: docker compose build
